<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OCR Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1a1a1a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #fff;
      }
      /* Toolbar */
      .toolbar {
        width: 100%;
        background: #252525;
        border-bottom: 1px solid #333;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        flex-shrink: 0;
      }
      .toolbar button {
        padding: 6px 16px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        background: #4ea3ff;
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .toolbar button:hover { background: #3892ee; }
      .toolbar button:disabled { background: #444; color: #888; cursor: not-allowed; }
      .toolbar button:disabled:hover { background: #444; }
      .toolbar button.secondary { background: #555; }
      .toolbar button.secondary:hover { background: #666; }
      .toolbar .status {
        font-size: 13px;
        color: #aaa;
        flex: 1;
      }
      /* PDF page nav (only shown when a PDF is loaded) */
      .pdf-nav {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        border-left: 1px solid #333;
      }
      .pdf-nav.active { display: flex; }
      .pdf-nav .page-indicator {
        min-width: 60px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        color: #ddd;
        font-size: 13px;
      }
      .pdf-nav button {
        padding: 4px 10px;
        font-size: 13px;
        background: #555;
      }
      .pdf-nav button:hover { background: #666; }
      /* Eraser: toggle button + options (only shown while erasing) */
      #btn-erase.active,
      #btn-erase.active:hover {
        background: #2a6fc0;
        box-shadow: inset 0 0 0 2px #fff;
      }
      .eraser-tools {
        display: none;
        align-items: center;
        gap: 6px;
      }
      .eraser-tools.active { display: flex; }
      .eraser-label { font-size: 12px; color: #aaa; }
      .eraser-sizes { display: flex; }
      .toolbar .eraser-sizes button {
        padding: 4px 10px;
        background: #444;
        border-radius: 0;
      }
      .toolbar .eraser-sizes button:first-child { border-radius: 6px 0 0 6px; }
      .toolbar .eraser-sizes button:last-child { border-radius: 0 6px 6px 0; }
      .toolbar .eraser-sizes button:hover { background: #555; }
      .toolbar .eraser-sizes button.active { background: #2a6fc0; }
      /* Canvas area */
      .canvas-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        width: 100%;
        position: relative;
      }
      canvas {
        cursor: crosshair;
        max-width: 100%;
        max-height: calc(100vh - 50px);
        object-fit: contain;
      }
      /* Toast */
      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #222;
        color: #fff;
        font-size: 14px;
        padding: 12px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        z-index: 2000;
        max-width: 400px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      .toast.show { opacity: 1; pointer-events: auto; }
      /* Live preview of the perspective-corrected quad region */
      #quad-preview-panel {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(37, 37, 37, 0.95);
        border: 1px solid #444;
        border-radius: 8px;
        padding: 8px 10px 10px;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        display: none;
      }
      #quad-preview-panel.active { display: block; }
      #quad-preview-label {
        font-size: 11px;
        color: #ccc;
        margin-bottom: 6px;
        text-align: center;
      }
      #quad-preview {
        display: block;
        max-width: 240px;
        max-height: 240px;
        background: #000;
        border-radius: 4px;
      }
      /* Drop zone */
      .dropzone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #888;
        font-size: 16px;
        padding: 60px;
      }
      .dropzone-icon { font-size: 48px; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="btn-open" class="secondary" data-i18n="viewerOpenButton"></button>
      <button id="btn-select" disabled data-i18n="viewerSelectButton"></button>
      <button id="btn-quad-select" disabled data-i18n="viewerQuadSelectButton"></button>
      <button id="btn-quad-confirm" style="display:none;" data-i18n="viewerQuadConfirmButton"></button>
      <button id="btn-ocr-all" disabled data-i18n="viewerOcrAllButton"></button>
      <button id="btn-erase" class="secondary" disabled aria-pressed="false" data-i18n="viewerEraserButton" data-i18n-title="viewerEraserTooltip"></button>
      <div class="eraser-tools" id="eraser-tools">
        <span class="eraser-label" data-i18n="viewerEraserSizeLabel"></span>
        <div class="eraser-sizes" role="group">
          <button class="eraser-size" data-size="s" aria-pressed="false" data-i18n="viewerEraserSizeSmall"></button>
          <button class="eraser-size active" data-size="m" aria-pressed="true" data-i18n="viewerEraserSizeMedium"></button>
          <button class="eraser-size" data-size="l" aria-pressed="false" data-i18n="viewerEraserSizeLarge"></button>
        </div>
        <button id="btn-erase-undo" class="secondary" disabled data-i18n="viewerEraserUndo" data-i18n-title="viewerEraserUndoTooltip"></button>
        <button id="btn-erase-reset" class="secondary" disabled data-i18n="viewerEraserReset"></button>
      </div>
      <div class="pdf-nav" id="pdf-nav">
        <button id="btn-pdf-prev" data-i18n-title="viewerPdfPrevButton" aria-label="prev">◀</button>
        <span class="page-indicator" id="pdf-page-indicator"></span>
        <button id="btn-pdf-next" data-i18n-title="viewerPdfNextButton" aria-label="next">▶</button>
      </div>
      <input type="file" id="file-input" accept="image/*,application/pdf,.pdf" style="display:none;" />
      <span class="status" id="status" data-i18n="viewerDropHint"></span>
    </div>
    <div class="canvas-area" id="canvas-area">
      <div class="dropzone" id="dropzone">
        <span class="dropzone-icon">📂</span>
        <span data-i18n="viewerDropHint"></span>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>
      <div id="quad-preview-panel">
        <div id="quad-preview-label" data-i18n="viewerQuadPreviewLabel"></div>
        <canvas id="quad-preview" width="2" height="2"></canvas>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
