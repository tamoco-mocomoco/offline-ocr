<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Sake Label OCR Demo (vertical)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@700;900&family=Yuji+Mai&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #5B9BD5;
    --ink: #1a1612;
    --paper: #f5ecd2;
    --paper-shadow: #d4c590;
    --seal: #c0392b;
    --bottle: #2a4d3a;
    --bottle-hi: #4f7a5e;
    --bg-gradient: linear-gradient(160deg, #1E3A5F 0%, #2C5F8A 50%, #5B9BD5 100%);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: var(--bg-gradient);
    overflow: hidden;
  }

  /* ===== Page header ===== */
  .page-header {
    position: absolute;
    top: 70px;
    left: 60px;
    width: 960px;
    text-align: center;
    color: #fff;
    z-index: 4;
  }
  .page-header-title {
    font-family: 'Yuji Mai', serif;
    font-weight: 900;
    font-size: 60px;
    letter-spacing: 12px;
    text-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .page-header-sub {
    margin-top: 8px;
    font-size: 22px;
    opacity: 0.7;
    letter-spacing: 4px;
  }

  /* ===== Bottle ===== */
  .bottle-container {
    position: absolute;
    top: 230px;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    height: 1280px;
    animation: bottleDim 8s linear 4s forwards;
  }
  @keyframes bottleDim {
    0%, 74% { opacity: 1; filter: brightness(1); }
    77%, 100% { opacity: 0.3; filter: brightness(0.55); }
  }

  /* Cap */
  .cap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 80px;
    background: linear-gradient(to bottom, #6b5635 0%, #4a3a22 50%, #3a2d18 100%);
    border-radius: 6px 6px 2px 2px;
  }
  .cap::after {
    content: '';
    position: absolute;
    inset: 6px 8px;
    border: 1px solid rgba(255, 220, 150, 0.25);
    border-radius: 3px;
  }

  /* Neck */
  .neck {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 210px;
    background: linear-gradient(to right, var(--bottle) 0%, var(--bottle-hi) 30%, var(--bottle) 60%, #1a3026 100%);
    border-radius: 4px 4px 0 0;
  }
  .neck::after {
    content: '';
    position: absolute;
    left: 18px; top: 30px;
    width: 8px; height: 140px;
    background: rgba(255,255,255,0.25);
    border-radius: 4px;
    filter: blur(1px);
  }

  /* Shoulder transition (subtle pill below neck) */
  .shoulder {
    position: absolute;
    top: 250px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 80px;
    background: linear-gradient(to right, var(--bottle) 0%, var(--bottle-hi) 30%, var(--bottle) 65%, #14241c 100%);
    border-radius: 100px 100px 8px 8px;
  }

  /* Body */
  .body {
    position: absolute;
    top: 320px;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 920px;
    background: linear-gradient(to right, var(--bottle) 0%, var(--bottle-hi) 30%, var(--bottle) 60%, #122019 100%);
    border-radius: 8px 8px 18px 18px;
    overflow: hidden;
  }
  .body::after {
    content: '';
    position: absolute;
    left: 36px; top: 60px;
    width: 16px; height: 700px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    filter: blur(2px);
  }
  /* Reflection */
  .body::before {
    content: '';
    position: absolute;
    right: 24px; top: 80px;
    width: 8px; height: 550px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    filter: blur(1.5px);
  }

  /* Label */
  .label {
    position: absolute;
    top: 410px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 780px;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,240,200,0.5) 0%, transparent 60%),
      linear-gradient(to bottom right, var(--paper) 0%, #ecdec2 50%, #e0d0a8 100%);
    box-shadow:
      0 8px 24px rgba(0,0,0,0.4),
      inset 0 0 60px rgba(160,120,60,0.15);
    z-index: 3;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Paper texture */
  .label::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        82deg,
        transparent 0,
        transparent 22px,
        rgba(140,100,40,0.05) 22px,
        rgba(140,100,40,0.05) 23px
      );
    pointer-events: none;
  }

  /* Top border lines */
  .label-rule {
    width: 90%;
    border-top: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    padding: 4px 0;
    margin-bottom: 14px;
  }
  .label-rule-inner {
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
    padding: 8px 0;
    text-align: center;
  }
  .label-grade {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 38px;
    color: var(--ink);
    letter-spacing: 10px;
    padding-left: 10px; /* offset trailing letter-spacing */
  }

  /* Main brand name (vertical) */
  .label-brand-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 14px 0;
    position: relative;
  }
  .label-brand {
    writing-mode: vertical-rl;
    font-family: 'Yuji Mai', serif;
    font-weight: 900;
    font-size: 150px;
    color: var(--ink);
    line-height: 1.05;
    letter-spacing: 0.04em;
  }

  /* Bottom area: maker + seal */
  .label-bottom {
    width: 90%;
    border-top: 2px solid var(--ink);
    padding-top: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .label-maker {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 30px;
    color: var(--ink);
    letter-spacing: 4px;
  }
  .label-seal {
    width: 56px;
    height: 56px;
    background: var(--seal);
    color: #fff;
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transform: rotate(-4deg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25), inset 0 0 0 2px rgba(255,255,255,0.2);
    letter-spacing: -1px;
    flex-shrink: 0;
  }
  .label-seal::before { content: '蔵元'; }

  /* ===== Highlight callout around brand name ===== */
  .label-callout {
    position: absolute;
    top: 790px;
    left: 440px;
    width: 200px;
    height: 505px;
    border: 5px dashed #FFC107;
    border-radius: 18px;
    opacity: 0;
    z-index: 70;
    pointer-events: none;
    animation: labelCallout 4s linear forwards;
    box-shadow: 0 0 50px rgba(255,193,7,0.55);
  }
  @keyframes labelCallout {
    0%, 25% { opacity: 0; transform: scale(0.92); }
    32% { opacity: 1; transform: scale(1.04); }
    40% { opacity: 1; transform: scale(1); }
    85% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }

  /* ===== Selection ===== */
  .crosshair {
    position: absolute;
    width: 36px;
    height: 36px;
    z-index: 90;
    pointer-events: none;
    opacity: 0;
    animation: crosshairMove 8s linear 4s forwards;
  }
  @keyframes crosshairMove {
    0%, 12% { opacity: 0; left: 450px; top: 800px; }
    14% { opacity: 1; left: 450px; top: 800px; }
    26% { opacity: 1; left: 635px; top: 1290px; }
    62% { opacity: 1; left: 635px; top: 1290px; }
    66% { opacity: 0; left: 635px; top: 1290px; }
    100% { opacity: 0; }
  }
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: var(--primary);
  }
  .crosshair::before { width: 3px; height: 36px; left: 16px; top: 0; }
  .crosshair::after { width: 36px; height: 3px; top: 16px; left: 0; }

  .selection-rect {
    position: absolute;
    border: 4px solid var(--primary);
    background: rgba(91, 155, 213, 0.10);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    animation: selRect 8s linear 4s forwards;
  }
  @keyframes selRect {
    0%, 12% { opacity: 0; top: 795px; left: 445px; width: 0; height: 0; }
    14% { opacity: 1; top: 795px; left: 445px; width: 0; height: 0; }
    26% { opacity: 1; top: 795px; left: 445px; width: 190px; height: 495px; }
    62% { opacity: 1; top: 795px; left: 445px; width: 190px; height: 495px; }
    65% { opacity: 0; }
    100% { opacity: 0; }
  }
  .selection-rect::before {
    content: '';
    position: absolute;
    top: -8px; left: -8px;
    width: 14px; height: 14px;
    border: 3px solid var(--primary);
    background: #fff;
    border-radius: 3px;
  }
  .selection-rect::after {
    content: '';
    position: absolute;
    bottom: -8px; right: -8px;
    width: 14px; height: 14px;
    border: 3px solid var(--primary);
    background: #fff;
    border-radius: 3px;
  }

  .scan-line {
    position: absolute;
    top: 795px;
    left: 445px;
    width: 190px;
    height: 5px;
    background: linear-gradient(90deg, transparent 0%, var(--primary) 30%, #fff 50%, var(--primary) 70%, transparent 100%);
    z-index: 85;
    opacity: 0;
    pointer-events: none;
    animation: scanLine 8s linear 4s forwards;
    box-shadow: 0 0 16px rgba(91,155,213,0.8);
  }
  @keyframes scanLine {
    0%, 30% { opacity: 0; top: 795px; }
    32% { opacity: 1; top: 795px; }
    44% { opacity: 1; top: 1285px; }
    45% { opacity: 0; top: 1285px; }
    100% { opacity: 0; }
  }

  /* ===== Toast ===== */
  .toast {
    position: absolute;
    top: 170px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a2e;
    color: #4ADE80;
    padding: 22px 48px;
    border-radius: 14px;
    font-size: 32px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    z-index: 95;
    opacity: 0;
    animation: toast 8s linear 4s forwards;
    display: flex;
    align-items: center;
    gap: 14px;
    white-space: nowrap;
  }
  @keyframes toast {
    0%, 47% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
    49% { opacity: 1; transform: translateX(-50%) translateY(0); }
    66% { opacity: 1; transform: translateX(-50%) translateY(0); }
    69% { opacity: 0; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; }
  }

  /* ===== Result Panel ===== */
  .result-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: 940px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    z-index: 88;
    opacity: 0;
    overflow: hidden;
    animation: resultPanel 8s linear 4s forwards;
  }
  @keyframes resultPanel {
    0%, 74% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    77%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .result-header {
    background: #f8f9fa;
    padding: 26px 36px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid #e5e7eb;
  }
  .result-header-icon {
    width: 44px;
    height: 44px;
    background: var(--primary);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
  }
  .result-header-title {
    font-size: 26px;
    font-weight: 700;
    color: #333;
  }
  .result-body {
    padding: 48px 36px;
    text-align: center;
  }
  .result-text {
    font-size: 46px;
    font-weight: 900;
    color: #1E3A5F;
    background: #f0f7ff;
    border: 3px dashed var(--primary);
    border-radius: 14px;
    padding: 30px 36px;
    display: inline-block;
    font-family: 'Noto Serif JP', serif;
    letter-spacing: 4px;
    line-height: 1.6;
    max-width: 100%;
  }
  .result-label {
    margin-top: 22px;
    font-size: 22px;
    color: #888;
  }

  /* ===== Telops ===== */
  .telop {
    position: absolute;
    bottom: 160px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    font-weight: 900;
    color: #fff;
    background: rgba(0,0,0,0.65);
    border-radius: 18px;
    padding: 24px 56px;
    white-space: nowrap;
    opacity: 0;
    z-index: 60;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .telop-1 {
    animation: telop1 8s linear 4s forwards;
  }
  @keyframes telop1 {
    0%, 2% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    5% { opacity: 1; transform: translateX(-50%) translateY(0); }
    24% { opacity: 1; }
    28% { opacity: 0; }
    100% { opacity: 0; }
  }
  .telop-2 {
    animation: telop2 8s linear 4s forwards;
    background: rgba(192, 57, 43, 0.92);
  }
  @keyframes telop2 {
    0%, 73% { opacity: 0; transform: translateX(-50%) scale(0.85); }
    77% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    80%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }
</style>
</head>
<body>
<div class="slide">

  <!-- Page header -->
  <div class="page-header">
    <div class="page-header-title">銘酒</div>
    <div class="page-header-sub">SAKE LABEL SAMPLE</div>
  </div>

  <!-- Bottle -->
  <div class="bottle-container">
    <div class="cap"></div>
    <div class="neck"></div>
    <div class="shoulder"></div>
    <div class="body"></div>

    <!-- Label -->
    <div class="label">
      <div class="label-rule">
        <div class="label-rule-inner">
          <div class="label-grade">純米大吟醸</div>
        </div>
      </div>

      <div class="label-brand-wrap">
        <div class="label-brand">雪月花</div>
      </div>

      <div class="label-bottom">
        <div class="label-maker">山田酒造</div>
        <div class="label-seal"></div>
      </div>
    </div>
  </div>

  <!-- Highlight callout around label -->
  <div class="label-callout"></div>

  <!-- Selection UI -->
  <div class="selection-rect"></div>
  <div class="scan-line"></div>
  <div class="crosshair"></div>

  <!-- Toast -->
  <div class="toast">
    <span>&#10003;</span> コピーしました (3文字)
  </div>

  <!-- Result panel -->
  <div class="result-panel">
    <div class="result-header">
      <div class="result-header-icon">📋</div>
      <div class="result-header-title">クリップボードにコピー</div>
    </div>
    <div class="result-body">
      <div class="result-text">雪月花</div>
      <div class="result-label">縦書きの商品ラベルも読み取り</div>
    </div>
  </div>

  <!-- Telops -->
  <div class="telop telop-1">日本酒のラベルも</div>
  <div class="telop telop-2">🍶 商品ラベルOCRもイケる！</div>

</div>
</body>
</html>
