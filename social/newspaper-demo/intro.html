<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Intro - Newspaper Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #111;
  }

  .slide {
    width: 1080px; height: 1920px;
    background: linear-gradient(135deg, #1E3A5F 0%, #2C5F8A 50%, #5B9BD5 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff;
    overflow: hidden;
    position: relative;
    gap: 40px;
  }

  .slide::before, .slide::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    opacity: 0;
  }
  .slide::before {
    top: 15%; left: -10%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    animation: glowFloat 3s ease-in-out infinite 0.3s;
  }
  .slide::after {
    bottom: 10%; right: -15%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(91,155,213,0.15) 0%, transparent 70%);
    animation: glowFloat 3s ease-in-out infinite 0.8s;
  }

  .burst {
    position: absolute;
    width: 100%; height: 100%;
    opacity: 0;
    animation: burstIn 0.4s ease forwards 0.1s;
  }
  .burst::before, .burst::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.08);
  }
  .burst::before {
    width: 600px; height: 600px;
    animation: ringExpand 1.5s ease-out forwards 0.2s;
  }
  .burst::after {
    width: 900px; height: 900px;
    animation: ringExpand 1.5s ease-out forwards 0.5s;
  }

  .icon {
    width: 180px; height: 180px;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 60px rgba(91,155,213,0.3);
    opacity: 0;
    transform: scale(0.3) rotate(-10deg);
    animation: iconBounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.2s;
    position: relative;
    z-index: 10;
  }
  .icon img { width: 100%; height: 100%; }

  .icon::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
    animation: iconShine 0.6s ease forwards 0.9s;
    opacity: 0;
  }

  h1 {
    font-size: 76px;
    font-weight: 900;
    text-align: center;
    line-height: 1.3;
    letter-spacing: 3px;
    opacity: 0;
    position: relative;
    z-index: 10;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    animation: titleSlam 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.7s;
  }

  .subtitle {
    font-size: 38px;
    color: rgba(255,255,255,0.9);
    text-align: center;
    line-height: 1.5;
    opacity: 0;
    z-index: 10;
    position: relative;
    animation: fadeSlideUp 0.4s ease forwards 1.2s;
  }
  .subtitle .accent {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    color: #FFC107;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 40px;
    padding: 14px 36px;
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    opacity: 0;
    z-index: 10;
    position: relative;
    animation: tagPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 1.6s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  @keyframes iconBounce {
    0%   { opacity: 0; transform: scale(0.3) rotate(-10deg); }
    60%  { opacity: 1; transform: scale(1.1) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes iconShine {
    from { opacity: 0; transform: translateX(-30%) translateY(-30%); }
    50%  { opacity: 1; }
    to   { opacity: 0; transform: translateX(30%) translateY(30%); }
  }
  @keyframes titleSlam {
    0%   { opacity: 0; transform: scale(1.5) translateY(-20px); }
    60%  { opacity: 1; transform: scale(0.95) translateY(5px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes tagPop {
    0%   { opacity: 0; transform: scale(0.5); }
    70%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes glowFloat {
    0%, 100% { opacity: 0.5; transform: translateY(0); }
    50%      { opacity: 1; transform: translateY(-20px); }
  }
  @keyframes ringExpand {
    from { opacity: 0.5; transform: translate(-50%,-50%) scale(0.3); }
    to   { opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }
  @keyframes burstIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── Newspaper illustration ── */
  .newspaper {
    position: relative;
    width: 320px;
    height: 440px;
    z-index: 10;
    opacity: 0;
    transform: translateY(40px) rotate(-6deg) scale(0.85);
    animation: newsIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 1.0s;
    filter: drop-shadow(0 18px 32px rgba(0,0,0,0.4));
  }
  .news-page {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,250,230,0.4) 0%, transparent 60%),
      linear-gradient(to bottom right, #f5f2e8 0%, #ecdec2 100%);
    border-radius: 3px;
    overflow: hidden;
    padding: 18px 20px;
    color: #1a1612;
    font-family: 'Noto Serif JP', 'Yuji Mai', serif;
  }
  .news-mast {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px double #1a1612;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .news-mast-name {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 32px;
    letter-spacing: 4px;
  }
  .news-mast-meta {
    font-size: 10px;
    opacity: 0.7;
    letter-spacing: 1px;
  }
  .news-headline {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 22px;
    line-height: 1.25;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #1a1612;
  }
  .news-columns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    height: 210px;
  }
  .news-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .news-col .line {
    height: 2px;
    background: rgba(26,22,18,0.55);
    border-radius: 1px;
  }
  .news-col .line.short { width: 60%; }
  .news-col .line.med { width: 80%; }
  .news-col .photo {
    height: 60px;
    background:
      repeating-linear-gradient(45deg, #bdb08a 0 4px, #a89a72 4px 8px);
    border: 1px solid #1a1612;
    margin: 2px 0;
    border-radius: 1px;
  }
  .news-foot {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid #1a1612;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
  }
  .news-foot-tag {
    background: #1a1612;
    color: #f5f2e8;
    padding: 2px 8px;
    letter-spacing: 3px;
    font-weight: 900;
  }
  .news-corner {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 44px;
    height: 44px;
    background: transparent;
    border-top: 3px solid #1a1612;
    border-right: 3px solid #1a1612;
    transform: rotate(-8deg);
    opacity: 0.35;
    pointer-events: none;
  }

  @keyframes newsIn {
    0%   { opacity: 0; transform: translateY(60px) rotate(-15deg) scale(0.6); }
    60%  { opacity: 1; transform: translateY(-10px) rotate(-2deg) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) rotate(-6deg) scale(1); }
  }
</style>
</head>
<body>
<div class="slide">
  <div class="burst"></div>
  <div class="icon">
    <img src="../../public/icons/icon128.png" alt="icon">
  </div>
  <h1>Chrome拡張で<br>OCR作ってみた！</h1>

  <div class="newspaper">
    <div class="news-page">
      <div class="news-mast">
        <div class="news-mast-name">朝の一筆</div>
        <div class="news-mast-meta">第千二十三号</div>
      </div>
      <div class="news-headline">駅前の古書店 半世紀の歴史に幕</div>
      <div class="news-columns">
        <div class="news-col">
          <div class="line"></div>
          <div class="line"></div>
          <div class="line med"></div>
          <div class="line"></div>
          <div class="line short"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line med"></div>
          <div class="line"></div>
          <div class="line short"></div>
        </div>
        <div class="news-col">
          <div class="photo"></div>
          <div class="line"></div>
          <div class="line med"></div>
          <div class="line"></div>
          <div class="line short"></div>
        </div>
        <div class="news-col">
          <div class="line"></div>
          <div class="line short"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line med"></div>
          <div class="line"></div>
          <div class="line"></div>
          <div class="line short"></div>
          <div class="line"></div>
          <div class="line med"></div>
        </div>
      </div>
      <div class="news-foot">
        <span class="news-foot-tag">巷 の 話</span>
        <span>2026.7.5</span>
      </div>
    </div>
    <div class="news-corner"></div>
  </div>

  <p class="subtitle"><span class="accent">新聞のコラム</span>も<br>縦書きで読めるよ</p>
  <span class="tag">📰 新聞OCR</span>
</div>
</body>
</html>
