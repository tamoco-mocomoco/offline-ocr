<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Haiku OCR Demo (vertical)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@700;900&family=Yuji+Mai&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #5B9BD5;
    --ink: #1a1612;
    --paper: #f1e6cf;
    --paper-shadow: #c9b88f;
    --seal: #c0392b;
    --bg-gradient: linear-gradient(160deg, #1E3A5F 0%, #2C5F8A 50%, #5B9BD5 100%);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: var(--bg-gradient);
    overflow: hidden;
  }

  /* ===== Page header ===== */
  .page-header {
    position: absolute;
    top: 70px;
    left: 60px;
    width: 960px;
    text-align: center;
    color: #fff;
    z-index: 4;
  }
  .page-header-title {
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 52px;
    letter-spacing: 6px;
    text-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .page-header-sub {
    margin-top: 8px;
    font-size: 22px;
    opacity: 0.7;
    letter-spacing: 4px;
  }

  /* ===== Washi paper ===== */
  .washi {
    position: absolute;
    top: 260px;
    left: 70px;
    width: 940px;
    height: 1220px;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,235,180,0.5) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(180,140,80,0.18) 0%, transparent 70%),
      linear-gradient(to bottom right, #f5ebd2 0%, #ecdfbf 50%, #e4d3a5 100%);
    border-radius: 4px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.45),
      inset 0 0 100px rgba(160,120,60,0.18);
    overflow: hidden;
    animation: pageDim 8s linear 4s forwards;
  }
  @keyframes pageDim {
    0%, 74% { opacity: 1; filter: brightness(1); }
    77%, 100% { opacity: 0.3; filter: brightness(0.55); }
  }

  /* Washi fiber texture */
  .washi::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        82deg,
        transparent 0,
        transparent 28px,
        rgba(140,100,40,0.05) 28px,
        rgba(140,100,40,0.05) 29px
      ),
      repeating-linear-gradient(
        -75deg,
        transparent 0,
        transparent 32px,
        rgba(140,100,40,0.04) 32px,
        rgba(140,100,40,0.04) 33px
      );
    pointer-events: none;
  }

  /* Aged stains */
  .washi::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 12% 8%, rgba(120,80,40,0.18) 0%, transparent 6%),
      radial-gradient(circle at 88% 14%, rgba(120,80,40,0.12) 0%, transparent 5%),
      radial-gradient(circle at 22% 92%, rgba(120,80,40,0.14) 0%, transparent 7%),
      radial-gradient(circle at 75% 88%, rgba(120,80,40,0.1) 0%, transparent 5%);
    pointer-events: none;
  }

  /* Haiku columns (vertical, cursive) */
  .haiku {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: row-reverse; /* right to left */
    gap: 60px;
    z-index: 3;
    height: 920px;
    align-items: flex-start;
    color: var(--ink);
    font-family: 'Yuji Mai', serif;
  }
  .haiku-col {
    writing-mode: vertical-rl;
    font-size: 132px;
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 0 rgba(0,0,0,0.15);
    white-space: nowrap;
  }
  /* Slight randomness per column for handwritten feel */
  .haiku-col:nth-child(1) { transform: rotate(-0.6deg) translateY(0); }
  .haiku-col:nth-child(2) { transform: rotate(0.5deg) translateY(30px); }
  .haiku-col:nth-child(3) { transform: rotate(-0.3deg) translateY(15px); }

  /* Author + seal */
  .author-area {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: 14px;
    z-index: 3;
  }
  .author-name {
    font-family: 'Yuji Mai', serif;
    writing-mode: vertical-rl;
    font-size: 68px;
    color: var(--ink);
    line-height: 1.1;
  }
  .seal {
    width: 88px;
    height: 88px;
    background: var(--seal);
    color: #fff;
    font-family: 'Noto Serif JP', serif;
    font-weight: 900;
    font-size: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transform: rotate(-3deg);
    box-shadow: 0 3px 12px rgba(0,0,0,0.25), inset 0 0 0 3px rgba(255,255,255,0.18);
    margin-top: 14px;
    letter-spacing: -2px;
    flex-shrink: 0;
  }
  .seal::before {
    content: '芭蕉';
  }

  /* ===== Highlight callout around haiku ===== */
  .haiku-callout {
    position: absolute;
    top: 370px;
    left: 220px;
    width: 640px;
    height: 820px;
    border: 5px dashed #FFC107;
    border-radius: 24px;
    opacity: 0;
    z-index: 70;
    pointer-events: none;
    animation: bubbleCallout 4s linear forwards;
    box-shadow: 0 0 50px rgba(255,193,7,0.55);
  }
  @keyframes bubbleCallout {
    0%, 25% { opacity: 0; transform: scale(0.9); transform-origin: center; }
    32% { opacity: 1; transform: scale(1.04); }
    40% { opacity: 1; transform: scale(1); }
    85% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }

  /* ===== Selection ===== */
  .crosshair {
    position: absolute;
    width: 36px;
    height: 36px;
    z-index: 90;
    pointer-events: none;
    opacity: 0;
    animation: crosshairMove 8s linear 4s forwards;
  }
  @keyframes crosshairMove {
    0%, 12% { opacity: 0; left: 230px; top: 380px; }
    14% { opacity: 1; left: 230px; top: 380px; }
    26% { opacity: 1; left: 850px; top: 1180px; }
    62% { opacity: 1; left: 850px; top: 1180px; }
    66% { opacity: 0; left: 850px; top: 1180px; }
    100% { opacity: 0; }
  }
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: var(--primary);
  }
  .crosshair::before { width: 3px; height: 36px; left: 16px; top: 0; }
  .crosshair::after { width: 36px; height: 3px; top: 16px; left: 0; }

  .selection-rect {
    position: absolute;
    border: 4px solid var(--primary);
    background: rgba(91, 155, 213, 0.10);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    animation: selRect 8s linear 4s forwards;
  }
  @keyframes selRect {
    0%, 12% { opacity: 0; top: 380px; left: 225px; width: 0; height: 0; }
    14% { opacity: 1; top: 380px; left: 225px; width: 0; height: 0; }
    26% { opacity: 1; top: 380px; left: 225px; width: 630px; height: 800px; }
    62% { opacity: 1; top: 380px; left: 225px; width: 630px; height: 800px; }
    65% { opacity: 0; }
    100% { opacity: 0; }
  }
  .selection-rect::before {
    content: '';
    position: absolute;
    top: -8px; left: -8px;
    width: 14px; height: 14px;
    border: 3px solid var(--primary);
    background: #fff;
    border-radius: 3px;
  }
  .selection-rect::after {
    content: '';
    position: absolute;
    bottom: -8px; right: -8px;
    width: 14px; height: 14px;
    border: 3px solid var(--primary);
    background: #fff;
    border-radius: 3px;
  }

  .scan-line {
    position: absolute;
    top: 380px;
    left: 225px;
    width: 630px;
    height: 5px;
    background: linear-gradient(90deg, transparent 0%, var(--primary) 30%, #fff 50%, var(--primary) 70%, transparent 100%);
    z-index: 85;
    opacity: 0;
    pointer-events: none;
    animation: scanLine 8s linear 4s forwards;
    box-shadow: 0 0 16px rgba(91,155,213,0.8);
  }
  @keyframes scanLine {
    0%, 30% { opacity: 0; top: 380px; }
    32% { opacity: 1; top: 380px; }
    44% { opacity: 1; top: 1175px; }
    45% { opacity: 0; top: 1175px; }
    100% { opacity: 0; }
  }

  /* ===== Toast ===== */
  .toast {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a2e;
    color: #4ADE80;
    padding: 22px 48px;
    border-radius: 14px;
    font-size: 32px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    z-index: 95;
    opacity: 0;
    animation: toast 8s linear 4s forwards;
    display: flex;
    align-items: center;
    gap: 14px;
    white-space: nowrap;
  }
  @keyframes toast {
    0%, 47% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
    49% { opacity: 1; transform: translateX(-50%) translateY(0); }
    66% { opacity: 1; transform: translateX(-50%) translateY(0); }
    69% { opacity: 0; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; }
  }

  /* ===== Result Panel ===== */
  .result-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: 940px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    z-index: 88;
    opacity: 0;
    overflow: hidden;
    animation: resultPanel 8s linear 4s forwards;
  }
  @keyframes resultPanel {
    0%, 74% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    77%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .result-header {
    background: #f8f9fa;
    padding: 26px 36px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid #e5e7eb;
  }
  .result-header-icon {
    width: 44px;
    height: 44px;
    background: var(--primary);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 24px;
  }
  .result-header-title {
    font-size: 26px;
    font-weight: 700;
    color: #333;
  }
  .result-body {
    padding: 48px 36px;
    text-align: center;
  }
  .result-text {
    font-size: 48px;
    font-weight: 900;
    color: #1E3A5F;
    background: #f0f7ff;
    border: 3px dashed var(--primary);
    border-radius: 14px;
    padding: 30px 32px;
    display: inline-block;
    font-family: 'Noto Serif JP', serif;
    letter-spacing: 2px;
    line-height: 1.5;
  }
  .result-label {
    margin-top: 22px;
    font-size: 22px;
    color: #888;
  }

  /* ===== Telops ===== */
  .telop {
    position: absolute;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    font-weight: 900;
    color: #fff;
    background: rgba(0,0,0,0.65);
    border-radius: 18px;
    padding: 24px 56px;
    white-space: nowrap;
    opacity: 0;
    z-index: 60;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .telop-1 {
    animation: telop1 8s linear 4s forwards;
  }
  @keyframes telop1 {
    0%, 2% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    5% { opacity: 1; transform: translateX(-50%) translateY(0); }
    24% { opacity: 1; }
    28% { opacity: 0; }
    100% { opacity: 0; }
  }
  .telop-2 {
    animation: telop2 8s linear 4s forwards;
    background: rgba(192, 57, 43, 0.92);
  }
  @keyframes telop2 {
    0%, 73% { opacity: 0; transform: translateX(-50%) scale(0.85); }
    77% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    80%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }
</style>
</head>
<body>
<div class="slide">

  <!-- Page header -->
  <div class="page-header">
    <div class="page-header-title">俳句帖</div>
    <div class="page-header-sub">HAIKU SAMPLE</div>
  </div>

  <!-- Washi paper with cursive haiku -->
  <div class="washi">
    <div class="haiku">
      <!-- Read right→left, top→bottom -->
      <div class="haiku-col">古池や</div>
      <div class="haiku-col">蛙飛びこむ</div>
      <div class="haiku-col">水の音</div>
    </div>
    <div class="author-area">
      <div class="author-name">芭蕉</div>
      <div class="seal"></div>
    </div>
  </div>

  <!-- Highlight callout around haiku area -->
  <div class="haiku-callout"></div>

  <!-- Selection UI -->
  <div class="selection-rect"></div>
  <div class="scan-line"></div>
  <div class="crosshair"></div>

  <!-- Toast -->
  <div class="toast">
    <span>&#10003;</span> コピーしました (12文字)
  </div>

  <!-- Result panel -->
  <div class="result-panel">
    <div class="result-header">
      <div class="result-header-icon">📋</div>
      <div class="result-header-title">クリップボードにコピー</div>
    </div>
    <div class="result-body">
      <div class="result-text">古池や 蛙飛びこむ 水の音</div>
      <div class="result-label">崩し字の俳句もそのまま読み取り</div>
    </div>
  </div>

  <!-- Telops -->
  <div class="telop telop-1">崩し字もそのまま読める</div>
  <div class="telop telop-2">🖌️ 手書きOCRもイケる！</div>

</div>
</body>
</html>
