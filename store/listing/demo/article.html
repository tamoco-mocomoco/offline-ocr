<!doctype html>
<!-- 範囲選択の撮影に使う、架空のブログ記事 (capture.mjs が https://blog.example.jp/ として配る) -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>週末の古本屋めぐり | 見本ブログ</title>
<style>
  body { margin: 0; font-family: "Hiragino Sans", sans-serif; color: #222; background: #fafaf7; }
  header { background: #fff; border-bottom: 1px solid #e5e2da; padding: 18px 48px; display: flex; align-items: center; gap: 14px; }
  header .logo { width: 34px; height: 34px; border-radius: 8px; background: #e9b86a; }
  header b { font-size: 20px; }
  header nav { margin-left: auto; color: #777; font-size: 15px; display: flex; gap: 22px; }
  main { max-width: 900px; margin: 0 auto; padding: 36px 24px; display: grid; grid-template-columns: 1fr 330px; gap: 36px; align-items: start; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  .date { color: #888; font-size: 14px; margin-bottom: 22px; }
  p { line-height: 1.9; font-size: 16px; }
  figure { margin: 0; }
  figure img { width: 330px; display: block; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  figcaption { color: #888; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<header><div class="logo"></div><b>見本ブログ</b><nav><span>本</span><span>まち歩き</span><span>このブログについて</span></nav></header>
<main>
  <article>
    <h1>週末の古本屋めぐり</h1>
    <div class="date">2026年11月1日</div>
    <p>駅前の古本屋で、昭和の小説を一冊見つけました。開いた頁の書き出しが気に入って、写真に撮っておきました。</p>
    <p>写真の文字は、そのままではコピーできません。あとで引用したいので、文字だけ取り出しておきたいところです。</p>
    <p>次は、となり町の古本市にも行ってみるつもりです。</p>
  </article>
  <figure><img src="book.png" alt="古本の頁"><figcaption>見つけた本の一頁</figcaption></figure>
</main>
</body>
</html>
